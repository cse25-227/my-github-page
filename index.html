<p>Pull the string to light up the bulb:</p>
        
        <div class="light-fixture">
            <svg class="bulb-svg" width="100" height="150" viewBox="0 0 100 150">
                <!-- The Socket -->
                <rect x="35" y="0" width="30" height="20" fill="#333" />
                
                <!-- The Bulb -->
                <path id="bulb" class="bulb-off" d="M50,20 C30,20 15,35 15,55 C15,75 35,90 35,110 L65,110 C65,90 85,75 85,55 C85,35 70,20 50,20 Z" />
                
                <!-- The Filament -->
                <path d="M40,110 L40,120 M50,110 L50,125 M60,110 L60,120" stroke="#555" stroke-width="2" />
                
                <!-- The Base -->
                <rect x="35" y="110" width="30" height="15" fill="#555" />
            </svg>
            
            <!-- The String -->
            <div id="pull-string" class="pull-string">
                <div class="string-line"></div>
                <div class="string-handle"></div>
            </div>
        </div>
